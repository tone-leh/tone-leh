# 放到 tone-leh/tone-leh 仓库的 .github/workflows/snake.yml
# 每天自动生成一次贡献图贪吃蛇（亮色 + 暗色两版），推到 output 分支
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点（台北早上 8 点）
  workflow_dispatch:       # 允许手动运行
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C9A227&color_dots=#ebedf0,#cdd6e4,#93a6c4,#d9c27a,#c9a227
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C9A227&color_dots=#161b22,#1c2e4a,#2e4a72,#7a6a2c,#c9a227

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
