  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="900" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F6F1"/>
      <stop offset="100%" stop-color="#F1EDE3"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C29C4E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C29C4E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C29C4E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fClip">
