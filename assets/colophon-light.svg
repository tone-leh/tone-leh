  <style>
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    .horizon-beam {
      animation: horizonSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes horizonSweep {
      0% { transform: translateX(-220px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(920px); opacity: 0; }
    }
    .diamond-breathe {
      transform-origin: 450px 48px;
      animation: dBreathe 5s ease-in-out infinite;
    }
    @keyframes dBreathe {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.86); }
    }
  </style>

