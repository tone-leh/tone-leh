<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F6F1"/>
      <stop offset="100%" stop-color="#F1EDE3"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="88" x2="0" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121418"/>
      <stop offset="100%" stop-color="#7D5E22"/>
    </linearGradient>
    <linearGradient id="topShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C29C4E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C29C4E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C29C4E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rowSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A7732" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9A7732" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9A7732" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="76%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#9A7732" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#9A7732" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="899" height="325" rx="10"/>
    </clipPath>
    <clipPath id="activeRowClip">
      <rect x="492" y="186" width="352" height="50" rx="5"/>
    </clipPath>
  </defs>

  <style>
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, 'Songti SC', serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }

    /* Slow horological orbital ring */
    .orbit-spin {
      transform-origin: 228px 152px;
      animation: orbitSpin 56s linear infinite;
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Top border shimmer beam */
    .border-beam {
      animation: beamSlide 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes beamSlide {
      0% { transform: translateX(-220px); opacity: 0; }
      12% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateX(920px); opacity: 0; }
    }

    /* Status jewel gentle pulse */
    .jewel-pulse {
      animation: jewelPulse 3.2s ease-in-out infinite;
    }
    @keyframes jewelPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.4; }
    }

    /* THE DECISION 11s Choreographed Loop */
    /* Row 01: Claude Code strike 8% -> 16%, hold to 86% */
    .strike-1 {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: strike1 11s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes strike1 {
      0%, 7% { stroke-dashoffset: 120; opacity: 0; }
      8% { opacity: 1; }
      16%, 86% { stroke-dashoffset: 0; opacity: 0.9; }
      94%, 100% { stroke-dashoffset: 120; opacity: 0; }
    }
    .row1-txt {
      animation: dim1 11s ease-in-out infinite;
    }
    @keyframes dim1 {
      0%, 9% { opacity: 0.9; }
      16%, 86% { opacity: 0.34; }
      94%, 100% { opacity: 0.9; }
    }
    .tag1 {
      animation: showTag1 11s ease-in-out infinite;
    }
    @keyframes showTag1 {
      0%, 11% { opacity: 0; transform: translateX(4px); }
      18%, 85% { opacity: 0.78; transform: translateX(0); }
      93%, 100% { opacity: 0; transform: translateX(4px); }
    }

    /* Row 02: Codex / ChatGPT strike 20% -> 28%, hold to 86% */
    .strike-2 {
      stroke-dasharray: 148;
      stroke-dashoffset: 148;
      animation: strike2 11s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes strike2 {
      0%, 19% { stroke-dashoffset: 148; opacity: 0; }
      20% { opacity: 1; }
      28%, 86% { stroke-dashoffset: 0; opacity: 0.9; }
      94%, 100% { stroke-dashoffset: 148; opacity: 0; }
    }
    .row2-txt {
      animation: dim2 11s ease-in-out infinite;
    }
    @keyframes dim2 {
      0%, 21% { opacity: 0.9; }
      28%, 86% { opacity: 0.34; }
      94%, 100% { opacity: 0.9; }
    }
    .tag2 {
      animation: showTag2 11s ease-in-out infinite;
    }
    @keyframes showTag2 {
      0%, 23% { opacity: 0; transform: translateX(4px); }
      30%, 85% { opacity: 0.78; transform: translateX(0); }
      93%, 100% { opacity: 0; transform: translateX(4px); }
    }

    /* Row 03: Google Antigravity + Gemini illuminates 32% -> 88% */
    .row3-frame {
      animation: glow3 11s ease-in-out infinite;
    }
    @keyframes glow3 {
      0%, 28% { stroke-opacity: 0.28; fill-opacity: 0.25; }
      36%, 86% { stroke-opacity: 0.95; fill-opacity: 1; }
      94%, 100% { stroke-opacity: 0.28; fill-opacity: 0.25; }
    }
    .row3-badge {
      animation: badge3 11s ease-in-out infinite;
    }
    @keyframes badge3 {
      0%, 30% { opacity: 0.45; }
      37%, 86% { opacity: 1; }
      94%, 100% { opacity: 0.45; }
    }
    .row3-sheen {
      animation: sheen3 11s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes sheen3 {
      0%, 35% { transform: translateX(-180px); opacity: 0; }
      38% { opacity: 1; }
      52% { transform: translateX(400px); opacity: 0; }
      100% { transform: translateX(400px); opacity: 0; }
    }
  </style>

  <!-- Base Canvas -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="900" height="326" rx="10" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="326" fill="url(#ambientGlow)"/>

    <!-- Subtle architectural grid lines -->
    <g stroke="#C8BFA9" stroke-width="0.6" opacity="0.22">
