      <line x1="11" y1="18" x2="15.5" y2="18" stroke="#D4B475" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="20.5" y1="13.5" x2="25" y2="13.5" stroke="#D4B475" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="20.5" y1="18" x2="25" y2="18" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
