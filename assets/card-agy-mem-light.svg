  <!-- Card Frame -->
  <rect x="0.5" y="0.5" width="437" height="141" rx="8" fill="url(#cBg)" stroke="#DDD6C7" stroke-width="1"/>
  <!-- Top micro gold accent bar -->
  <line x1="18" y1="0.5" x2="62" y2="0.5" stroke="#9A7732" stroke-width="1.5"/>

  <!-- Top Row: Index + Category Tag -->
  <text x="18" y="24" class="mono" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#9A7732">02</text>
  <rect x="284" y="12" width="136" height="18" rx="3.5" fill="#F2EEE5" stroke="#D8D0BF" stroke-width="0.8"/>
  <text x="352" y="24" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#7C828E">MCP APP · SHA-256</text>

  <!-- Icon Bezel -->
  <g transform="translate(18, 42)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="6" fill="#F8F6F1" stroke="#DDD6C7" stroke-width="0.9"/>
    
      <line x1="11" y1="12" x2="25" y2="11" stroke="#7C828E" stroke-width="1"/>
      <line x1="11" y1="12" x2="18" y2="25" stroke="#7C828E" stroke-width="1"/>
      <line x1="25" y1="11" x2="18" y2="25" stroke="#9A7732" stroke-width="1.1"/>
      <circle cx="11" cy="12" r="2.8" fill="#9A7732"/>
      <circle cx="25" cy="11" r="2.4" stroke="#9A7732" stroke-width="1.2"/>
      <circle cx="18" cy="25" r="2.8" fill="#9A7732"/>
    
  </g>

  <!-- Title & Chinese Subtitle -->
  <text x="68" y="57" class="sans" font-size="15" font-weight="600" letter-spacing="0.2" fill="#121418">Agy Mem</text>
  <text x="143" y="57" class="sans" font-size="11.5" fill="#B3924D">·  透明记忆图谱</text>

  <!-- Two-line Description -->
  <text x="68" y="77" class="sans" font-size="11.2" fill="#4B525E">Glass-box, code-anchored long-term memory &amp;</text>
  <text x="68" y="94" class="sans" font-size="11.2" fill="#4B525E">interactive knowledge graph with drift guard.</text>

