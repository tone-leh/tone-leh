<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 142" width="438" height="142" fill="none">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="438" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#F1EDE3"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
