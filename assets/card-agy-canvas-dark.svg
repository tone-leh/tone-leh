<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 142" width="438" height="142" fill="none">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="438" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#0E1016"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Card Frame -->
  <rect x="0.5" y="0.5" width="437" height="141" rx="8" fill="url(#cBg)" stroke="#1F242E" stroke-width="1"/>
  <!-- Top micro gold accent bar -->
  <line x1="18" y1="0.5" x2="62" y2="0.5" stroke="#D4B475" stroke-width="1.5"/>

  <!-- Top Row: Index + Category Tag -->
  <text x="18" y="24" class="mono" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#D4B475">03</text>
  <rect x="284" y="12" width="136" height="18" rx="3.5" fill="#12151D" stroke="#262C38" stroke-width="0.8"/>
  <text x="352" y="24" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#6B7280">MCP APP · 0 DEPS</text>

  <!-- Icon Bezel -->
  <g transform="translate(18, 42)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="6" fill="#08090C" stroke="#1F242E" stroke-width="0.9"/>
    
      <rect x="8" y="9" width="16" height="14" rx="1.5" stroke="#D4B475" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="14" y="14" width="14" height="12" rx="1.5" stroke="#6B7280" stroke-width="1.1"/>
      <circle cx="24" cy="11" r="2.2" fill="#D4B475"/>
    
  </g>

  <!-- Title & Chinese Subtitle -->
  <text x="68" y="57" class="sans" font-size="15" font-weight="600" letter-spacing="0.2" fill="#F2EFE8">Agy Canvas</text>
  <text x="163" y="57" class="sans" font-size="11.5" fill="#A88B52">·  批注画布</text>

  <!-- Two-line Description -->
  <text x="68" y="77" class="sans" font-size="11.2" fill="#A8B0BC">Figma-style visual review &amp; numbered box pins</text>
  <text x="68" y="94" class="sans" font-size="11.2" fill="#A8B0BC">for HTML, SVG, slides, Markdown &amp; images.</text>

  <!-- Bottom Meta Footer -->
  <line x1="18" y1="112" x2="420" y2="112" stroke="#171B23" stroke-width="0.8"/>
  <text x="18" y="129" class="mono" font-size="9.2" letter-spacing="0.8" fill="#6B7280">TypeScript  ·  MIT  ·  v0.1.0</text>
  <text x="420" y="129" text-anchor="end" class="mono" font-size="10.5" fill="#D4B475">VIEW REPO ↗</text>
</svg>
